<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Карточка товара Apple Watch</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="card">
        <img src="./img/apple-watch.jpg" alt="Фото Apple Watch" class="card__img">
        <h4 class="card__title">
            Apple Watch
        </h4>
        <div class="card__desc">
            <p class="card__text">
                Смарт-часы Apple Watch Series 3 GPS 38mm с <a href="#!" class="card__link">белым ремешком</a> дополнят стильный образ своего владельца и позволят легко контролировать результаты тренировок, слушать музыку и общаться с друзьями.
            </p> 
        </div>
        <div class="card__price">
            <span class="card__strong-price">Цена: </span>
            30 000 руб
        </div>
        <button class="card__btn" type="button">
            В корзину
        </button>
    </div>
</body>
</html>
